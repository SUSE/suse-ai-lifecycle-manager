apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "suse-ai-operator.labels" . | nindent 4 }}
  name: {{ include "suse-ai-operator.fullname" . }}
spec:
  replicas: {{ .Values.manager.replicaCount }}
  selector:
    matchLabels:
      {{- include "suse-ai-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.manager.podAnnotations | nindent 8 }}
      labels:
        {{- include "suse-ai-operator.labels" . | nindent 8 }}
    spec:
      containers:
        - name: manager
          image: "{{ with (coalesce .Values.global.imageRegistry .Values.manager.image.registry) }}{{ . }}/{{ end }}{{ .Values.manager.image.repository }}:{{ .Values.manager.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.manager.image.pullPolicy }}
          command:
            - /manager
          args:
          {{- if .Values.metrics.enable }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
          {{- else }}
            - --metrics-bind-address=0
          {{- end }}
            - --health-probe-bind-address=:8081
          {{- range .Values.manager.args }}
            - {{ . }}
          {{- end }}
          {{- if .Values.webhook.enable }}
            - --enable-webhooks
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
          {{- end }}

          {{- with .Values.manager.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- if or .Values.webhook.enable .Values.metrics.enable }}
          ports:
          {{- if .Values.webhook.enable }}
            - containerPort: {{ .Values.webhook.port }}
              name: webhook-server
              protocol: TCP
          {{- end }}
          {{- if .Values.metrics.enable }}
            - containerPort: {{ .Values.metrics.port }}
              name: metrics
              protocol: TCP
          {{- end }}
          {{- end }}
          
          {{- if .Values.manager.probes.liveness.enabled }}
          livenessProbe:
            {{- omit .Values.manager.probes.liveness "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.manager.probes.readiness.enabled }}
          readinessProbe:
            {{- omit .Values.manager.probes.readiness "enabled" | toYaml | nindent 12 }}
          {{- end }}
          resources:
            {{- if .Values.manager.resources }}
            {{- toYaml .Values.manager.resources | nindent 12 }}
            {{- else }}
            {}
            {{- end }}
          securityContext:
            {{- if .Values.manager.securityContext }}
            {{- toYaml .Values.manager.securityContext | nindent 12 }}
            {{- else }}
            {}
            {{- end }}
          volumeMounts:
            - mountPath: /home/nonroot/.cache
              name: helm-cache
            {{- if .Values.webhook.enable }}
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: webhook-cert
              readOnly: true
            {{- end }}
      serviceAccountName: {{ include "suse-ai-operator.fullname" . }}
      terminationGracePeriodSeconds: 30
      volumes:
        - emptyDir: {}
          name: helm-cache
        {{- if .Values.webhook.enable }}
        - name: webhook-cert
          secret:
            secretName: {{ include "suse-ai-operator.fullname" . }}-webhook-server-cert
            defaultMode: 420
        {{- end }}
      securityContext:
        {{- if .Values.manager.podSecurityContext }}
        {{- toYaml .Values.manager.podSecurityContext | nindent 8 }}
        {{- else }}
        {}
        {{- end }}
      {{- with .Values.manager.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

global:
  imageRegistry: ""
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

manager:
  replicaCount: 1
  
  image:
    registry: ghcr.io
    repository: suse/suse-ai-operator
    tag: ""
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  args:
    - --leader-elect

  env: []

  podAnnotations: {}

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
        type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
        drop:
            - ALL
    readOnlyRootFilesystem: true

  resources:
    limits:
        cpu: 500m
        memory: 128Mi
    requests:
        cpu: 10m
        memory: 64Mi

  probes:
    liveness:
      enabled: true
      httpGet:
        path: /healthz
        port: 8081
      periodSeconds: 20
      initialDelaySeconds: 15
    readiness:
      enabled: true
      httpGet:
        path: /readyz
        port: 8081
      periodSeconds: 10
      initialDelaySeconds: 5

  nodeSelector: {}
  tolerations: []
  affinity: {}

rbacHelpers:
  enable: false

metrics:
  enable: true
  port: 8443

extension:
  enable: true
  crName: suseai
  chartVersion: 1.1.0
  version: 1.1.0
  jobs:
    image:
      registry: registry.suse.com
      repository: suse/kubectl
      tag: "1.35.0"
      pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 32Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true

webhook:
  enable: true
  port: 9443
  certManager:
    enable: true
    # issuerRef: {}  # Optional: use a specific ClusterIssuer


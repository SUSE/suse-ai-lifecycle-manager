apiVersion: ai-platform.suse.com/v1alpha1
kind: Settings
metadata:
  name: settings
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aif-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
{{- with .Values.manager.settings }}
spec:
  {{- toYaml . | nindent 2 }}
{{- end }}
